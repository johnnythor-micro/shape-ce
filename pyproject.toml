[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "shapece"
version = "0.3.0"
description = "Modern notebook-based capillary-electrophoresis nucleic-acid probing analysis (a modern alternative to QuShape)."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "John Thorstenson"}]
dependencies = [
    "numpy>=1.24", "scipy>=1.10", "pandas>=2.0",
    "matplotlib>=3.7", "openpyxl>=3.1", "ViennaRNA>=2.6",
]

[project.optional-dependencies]
notebook = ["ipywidgets>=7.6"]

[project.urls]
Homepage = "https://github.com/johnnythor-micro/shape-ce"

[tool.setuptools]
packages = ["shapece"]
